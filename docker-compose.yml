services:
  mysql:
    image: mysql:8.4
    container_name: entaj-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "127.0.0.1:${DB_PORT:-3306}:3306"
    volumes:
      - entaj-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: entaj-app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    # Pulls in everything from .env (JWT_SECRET, ADMIN_EMAIL/PASSWORD, SMTP,
    # STORAGE_*, NEXT_PUBLIC_SITE_URL, ...); DATABASE_URL below overrides the
    # host-oriented value from .env so the app talks to the "mysql" service
    # by Docker network name instead of localhost.
    env_file:
      - .env
    environment:
      DATABASE_URL: mysql://${MYSQL_USER}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE}
      PORT: "3000"
    ports:
      - "${APP_PORT:-3000}:3000"
    volumes:
      - ./storage:/app/storage
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 10s
      retries: 6
      start_period: 180s

volumes:
  entaj-mysql-data:
